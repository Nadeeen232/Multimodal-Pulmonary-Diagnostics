# Pulmonary Review Assistant theme. Light and dark follow the viewer's system setting and can
# be switched in the app menu under Settings. ui/theme.py mirrors these colors for the custom
# HTML blocks.
#
# Lime is the action color. In the light theme Streamlit's own accent (toggles, the selected
# viewer tab, focus rings) is graphite, because lime on white fails the 3:1 contrast that
# controls need; theme.py paints the Analyze button lime in both themes.

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Viewer menu only: keeps Settings (theme switch), hides the developer Deploy button.
toolbarMode = "viewer"

[theme]
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true

[theme.light]
base = "light"
primaryColor = "#222323"
backgroundColor = "#F4F3EF"
secondaryBackgroundColor = "#EEEDE8"
textColor = "#222322"
borderColor = "#E3E3DE"
linkColor = "#222323"
greenColor = "#1E7A46"
orangeColor = "#A3520A"
redColor = "#B42318"

[theme.dark]
base = "dark"
primaryColor = "#D6F36A"
backgroundColor = "#171819"
secondaryBackgroundColor = "#2B2D2C"
textColor = "#F4F2ED"
borderColor = "#393B39"
linkColor = "#D6F36A"
greenColor = "#86D9A2"
orangeColor = "#F2B45A"
redColor = "#F97066"
