services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MODEL_BUNDLE_HOST:-./artifacts/team_bundle}:/models:ro
    environment:
      MODEL_BUNDLE: /models
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    restart: unless-stopped
  ui:
    build: ./ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
