[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-pulmonary"
version = "0.1.0"
description = "SIC multimodal chest radiograph research prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn>=1.6,<2", "Pillow>=11,<14", "matplotlib>=3.9,<4",
  "joblib>=1.4,<2", "torch>=2.5,<3", "torchvision>=0.20,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18,<1",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "mlflow>=3,<4", "optuna>=4,<6"
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "requests>=2.32,<3"]
data = ["kagglehub>=0.3,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
presentation = ["python-pptx>=1.0,<2", "python-docx>=1.1,<2"]
demo = ["playwright>=1.50,<2"]
reports = ["transformers==4.57.1", "tokenizers==0.22.1", "sentencepiece>=0.2,<1", "safetensors>=0.6,<1"]

[project.scripts]
pulmonary = "pulmonary.cli:main"

[tool.setuptools]
packages = ["pulmonary", "app"]
py-modules = ["report_generator"]

[tool.setuptools.package-dir]
"" = "src"
pulmonary = "src/pulmonary"
app = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
